<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seven | Tron: Legacy Grid</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <p class="eyebrow">Seven</p>
        <h1>Tron: Legacy Grid</h1>
        <p class="subtitle">
          A light-grid inspired by Tron: Legacy with luminous platforms and a
          glowing path across the arena.
        </p>
      </section>

      <section class="grid-panel" aria-labelledby="platform-grid-title">
        <div class="panel-header">
          <div>
            <h2 id="platform-grid-title">Arena Layout</h2>
            <p>7 x 7 light platforms with a highlighted run across the grid.</p>
          </div>
          <div class="legend" aria-label="Platform legend">
            <span><i class="legend-swatch start" aria-hidden="true"></i>Start</span>
            <span><i class="legend-swatch active" aria-hidden="true"></i>Route</span>
            <span><i class="legend-swatch end" aria-hidden="true"></i>End</span>
          </div>
        </div>

        <div
          class="platform-grid"
          id="platform-grid"
          role="list"
          aria-label="Seven platform grid"
        ></div>
      </section>
    </main>

    <script src="./script.js" defer></script>
  </body>
</html>
